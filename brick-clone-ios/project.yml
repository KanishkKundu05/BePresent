name: BePresent
options:
  bundleIdPrefix: com.bepresent
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  BePresent:
    type: application
    platform: iOS
    sources: [BePresent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bepresent.brick
        INFOPLIST_FILE: BePresent/Info.plist
        CODE_SIGN_ENTITLEMENTS: BePresent/BePresent.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: CoreNFC.framework
  BePresentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BePresentTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BePresent
schemes:
  BePresent:
    build:
      targets:
        BePresent: all
        BePresentTests: [test]
    test:
      targets: [BePresentTests]
